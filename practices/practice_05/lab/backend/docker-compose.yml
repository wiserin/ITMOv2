
services:
  database:
    # todo
    networks:
      - backend-private
  
  cache:
    # todo
    networks:
      - backend-private


  migrations:
    build:
      dockerfile: Dockerfile.migrations
      context: .
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy


  backend:
    build:
      dockerfile: Dockerfile.service
      context: .

    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
      

    networks:
      - backend-private

    ports:
      - "8080:8080"

volumes:
  pg_data:

networks:
  backend-private:
    driver: bridge
