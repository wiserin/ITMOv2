x-app-environment: &app-environment
  POSTGRES_USER: ${POSTGRES_USER:-animemap}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-animemap}
  POSTGRES_DB: ${POSTGRES_DB:-animemap}
  POSTGRES_HOST: database
  POSTGRES_PORT: "5432"
  REDIS_HOST: cache
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  REDIS_PASSWORD: ${REDIS_PASSWORD:-animemap}

services:
  database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-animemap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-animemap}
      POSTGRES_DB: ${POSTGRES_DB:-animemap}
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - backend-private

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-animemap}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-animemap}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s
    networks:
      - backend-private

  migrations:
    build:
      dockerfile: Dockerfile.migrations
      context: .
    restart: "no"
    environment: *app-environment
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - backend-private

  backend:
    build:
      dockerfile: Dockerfile.service
      context: .
    restart: unless-stopped
    environment:
      <<: *app-environment
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?Set base64 PEM Ed25519 key}
      SESSION_IDLE_TIMEOUT_MINUTES: ${SESSION_IDLE_TIMEOUT_MINUTES:-30}
      ARGON2_TIME_COST: ${ARGON2_TIME_COST:-3}
      ARGON2_MEMORY_COST: ${ARGON2_MEMORY_COST:-65536}
      ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-1}
      ARGON2_HASH_LEN: ${ARGON2_HASH_LEN:-32}
      ARGON2_SALT_LEN: ${ARGON2_SALT_LEN:-16}
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8080/ping', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - backend-private

volumes:
  pg_data:

networks:
  backend-private:
    driver: bridge
